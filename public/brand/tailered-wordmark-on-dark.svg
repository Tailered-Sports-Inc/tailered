  <path d="M70 30 L86 30 L86 46" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="108" y="64" font-family="'Familjen Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" letter-spacing="-1" fill="#FFFFFF">tailered</text>
