  <g fill="#45E0A8">
    <rect x="16" y="30" width="7" height="18" rx="1.5"/>
    <rect x="28.5" y="22" width="7" height="26" rx="1.5"/>
    <rect x="41" y="14" width="7" height="34" rx="1.5"/>
  </g>
  <path d="M15 46 L27 38 L35 42 L50 26" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43 24 L51 24 L51 32" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
