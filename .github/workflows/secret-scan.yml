name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks CLI (MIT, license-free) — the gitleaks-action wrapper requires
      # a paid license on org repos, so we run the binary directly instead.
      - name: gitleaks (secret scan)
        run: |
          VER=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-git --source . -c .gitleaks.toml --redact -v --exit-code 1

      - name: no server/schema imports in src/
        run: node scripts/check-no-server-imports.mjs

      - name: no dead-weight / sensitive paths
        run: node scripts/check-no-dead-weight.mjs
