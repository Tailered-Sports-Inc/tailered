name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: no server/schema imports in src/
        run: node scripts/check-no-server-imports.mjs

      - name: no dead-weight / sensitive paths
        run: node scripts/check-no-dead-weight.mjs
