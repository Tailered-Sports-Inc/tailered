name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The private engine ships this build output as Workers static assets
      # (see the engine's docs/SHELL-ASSETS.md). A broken build here blocks
      # the deploy, so it gates every PR.
      - run: pnpm build

      - run: pnpm exec tsc --noEmit
